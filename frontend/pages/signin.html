<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Adlync - Sign In</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <link href="../assert/css/signin.css" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <!-- Brand Logo -->
        <div class="brand-logo">
            <h1>Adlync</h1>
            <p>Welcome back to Sri Lanka's trusted marketplace</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Social Login -->
        <div class="social-login">
            <button class="btn btn-social" onclick="socialLogin('google')">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                          fill="#4285f4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                          fill="#34a853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                          fill="#fbbc05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                          fill="#ea4335"/>
                </svg>
                Google
            </button>
            <button class="btn btn-social" onclick="socialLogin('facebook')">
                <svg class="facebook-icon" viewBox="0 0 24 24">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                          fill="#1877f2"/>
                </svg>
                Facebook
            </button>
        </div>

        <!-- Divider -->
        <div class="divider">
            <span>or sign in with email</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="loginIdentifier">Email Address or Username</label>
                <input class="form-control" id="loginIdentifier" placeholder="example@mail.com or username" required
                       type="text">
                <div class="form-text">You can sign in with either your email address or username.</div>
                <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <input class="form-control" id="password" placeholder="••••••••" required type="password">
                    <button class="password-toggle" onclick="togglePassword()" type="button">
                        <i class="bi bi-eye" id="passwordIcon"></i>
                    </button>
                </div>
                <div class="invalid-feedback"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" id="rememberMe" type="checkbox" value="">
                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a class="text-primary-emerald" href="#" onclick="showForgotPassword()">Forgot password?</a>
            </div>

            <button class="btn btn-emerald w-100 mb-3" id="loginBtn" type="submit">
                Sign In
            </button>

            <div class="forgot-password">
                <a href="#" onclick="showForgotPassword()">Need help signing in?</a>
            </div>
        </form>

        <!-- Signup Link -->
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one now</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/cookies.js"></script>
<script src="../js/signin.js"></script>
</body>
</html>
