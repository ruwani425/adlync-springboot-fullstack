<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Category Selection & Dynamic Forms</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="../assert/css/postad.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <!-- Step Indicator -->
    <div class="step-indicator">
        <span class="step active" id="step1">1</span>
        <span class="step" id="step2">2</span>
        <span class="step" id="step3">3</span>
    </div>

    <!-- Category Selection -->
    <div id="categorySection">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Choose a Category</h2>
            <p class="lead text-muted">Select the category that best describes your item</p>
        </div>

        <!-- Category Grid -->
        <div id="categoryGrid"></div>

        <!-- Pagination Controls -->
        <div class="pagination-controls">
            <button class="btn btn-pagination" disabled id="prevPage">
                <i class="bi bi-chevron-left"></i> Previous
            </button>
            <div class="pagination-info" id="paginationInfo"></div>
            <button class="btn btn-pagination" id="nextPage">
                Next <i class="bi bi-chevron-right"></i>
            </button>
        </div>

        <!-- Continue Button -->
        <div class="text-center mt-4">
            <button class="btn btn-emerald btn-lg" disabled id="continueBtn">
                Continue to Details
            </button>
        </div>
    </div>

    <!-- Dynamic Form Section -->
    <div class="form-section" id="formSection">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Post Your Ad</h2>
            <div id="selectedCategoryBadge"></div>
        </div>
        <form id="dynamicForm"></form>

        <div class="text-center mt-4">
            <button class="btn btn-outline-secondary me-2" id="backBtn">
                <i class="bi bi-arrow-left"></i> Back to Categories
            </button>
            <button class="btn btn-emerald btn-lg" id="submitBtn">
                Post Advertisement
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/postad.js"></script>
