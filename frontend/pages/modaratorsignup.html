<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Moderator Sign Up - Adlync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assert/css/moderatorsignup.css" rel="stylesheet">
</head>
<body>
<div class="signup-card">
    <div class="card-header">
        <h3 class="mb-0">
            <i class="bi bi-shield-check me-2"></i>
            Moderator Sign Up
        </h3>
        <p class="mb-0 mt-2 opacity-75">Complete your account setup</p>
    </div>

    <div class="card-body">
        <form id="moderatorSignupForm">
            <div class="mb-4">
                <div class="form-floating position-relative">
                    <input class="form-control"
                           id="moderator-password"
                           placeholder="Password"
                           required
                           type="password">
                    <label for="moderator-password">
                        <i class="bi bi-lock me-2"></i>Password
                    </label>
                    <span class="password-toggle" onclick="togglePassword('password')">
                            <i class="bi bi-eye" id="password-eye"></i>
                        </span>
                </div>
                <div class="invalid-feedback" id="passwordError"></div>
                <small class="text-muted mt-1 d-block">
                    Password must be at least 8 characters long
                </small>
            </div>

            <div class="mb-4">
                <div class="form-floating position-relative">
                    <input class="form-control"
                           id="confirmPassword"
                           placeholder="Confirm Password"
                           required
                           type="password">
                    <label for="confirmPassword">
                        <i class="bi bi-lock-fill me-2"></i>Confirm Password
                    </label>
                    <span class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="bi bi-eye" id="confirmPassword-eye"></i>
                        </span>
                </div>
                <div class="invalid-feedback" id="confirmPasswordError"></div>
            </div>

            <button class="btn btn-signup w-100" id="moderator-sign-up" type="button">
                <span class="spinner-border spinner-border-sm d-none me-2" id="loadingSpinner"></span>
                Sign Up
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">
                By signing up, you agree to the moderator terms and conditions
            </small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/moderatorsignup.js"></script>
</body>
</html>
